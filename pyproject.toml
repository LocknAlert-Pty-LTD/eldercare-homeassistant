[project]
name = "locknalert-homeassistant"
version = "1.0.0"
description = "LocknAlert Eldercare household alerts for Home Assistant"
requires-python = ">=3.14.2"

# ---------------------------------------------------------------------------
# Type checking: `mypy` from the repo root. Strict everywhere, including tests.
# A `# type: ignore[code]` must name its error code.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
files = ["custom_components", "tests"]
explicit_package_bases = true
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "possibly-undefined",
    "redundant-self",
    "unused-awaitable",
]
# The harness's HTTP mock methods take *args/**kwargs without annotations
untyped_calls_exclude = ["pytest_homeassistant_custom_component"]

# The Home Assistant test harness ships without a py.typed marker; analyse it
# anyway so calls into it are still type-checked (only tests import it)
[[tool.mypy.overrides]]
module = ["pytest_homeassistant_custom_component.*"]
follow_untyped_imports = true

# ---------------------------------------------------------------------------
# Linting and formatting: `ruff check` and `ruff format` from the repo root.
# Every rule is on; the ignores below are formatter conflicts or rules that
# contradict Home Assistant conventions.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # trailing commas: owned by the formatter
    "ISC001",  # implicit string concatenation: conflicts with the formatter
    "D203",    # one blank line before class docstring (D211 is used instead)
    "D213",    # multi-line summary on the second line (D212 is used instead)
    "TD002",   # TODO author
    "TD003",   # TODO issue link
    "CPY001",  # copyright header in every file
    "TC001",   # type-only imports: HA resolves annotations at runtime
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # assert is how pytest checks
    "PLR2004",  # literal values in assertions are the point of a test
    "SLF001",   # tests may inspect private state
    "S105",     # fake tokens in tests are not secrets
    "S106",     # fake tokens passed as arguments
    "FBT001",   # boolean positional args in parametrised tests
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components", "tests"]
combine-as-imports = true

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

# ---------------------------------------------------------------------------
# Tests: `pytest` from the repo root.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["real_push: use the real push socket client instead of the stand-in"]
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
source = ["custom_components/locknalert"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
